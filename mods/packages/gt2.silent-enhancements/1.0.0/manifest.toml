[[feature]]
id = "arcade_all_tracks"
name = "Arcade: Unlock All Tracks"
description = "Unlocks every arcade-mode track in all menus (1P, 2P, rally, time trial). Patches the game's own unlock check (reverse-engineered from the v1.1 arcade code, which the Arcade disc and the Combined Disc share) so every course passes it. Menus are rebuilt when you enter Arcade mode, so enter (or re-enter) Arcade mode after enabling."
group = "Cheats"
default_enabled = false
# Patches the game's own unlock check rather than writing the classic
# GameShark data (those codes are for the v1.0 Arcade disc). The three code
# words are byte-identical on the v1.1 Arcade disc (SCUS-94455) and the
# Combined Disc's rebuilt arcade mode - verified in the lab on both, see
# docs/CHEAT_VERIFICATION.md - and the write-if-match guard means the patch
# only ever lands on that exact code. The Combined Disc is pinned by exe hash
# because it reports the Simulation serial.
[[feature.target]]
game_id = "SCUS-94455"

[[feature.target]]
game_id = "SCUS-94488"
exe_sha256 = "3e77a7a1ac9ba673efb20a703de60b8504029bec54c94f3cb98476293cf74c0b"

[[plugin]]
feature = "arcade_all_tracks"
id = "gt2.arcadetracks"

[[feature]]
id = "arcade_all_cars"
name = "Arcade: Unlock All Cars"
description = "Unlocks the extra arcade cars: patches the unlock-flag test in the menu code and marks every road track as beaten on all difficulties (reverse-engineered from the v1.1 arcade code, which the Arcade disc and the Combined Disc share). Enter (or re-enter) Arcade mode after enabling."
group = "Cheats"
default_enabled = false
# Same code on both discs (see arcade_all_tracks).
[[feature.target]]
game_id = "SCUS-94455"

[[feature.target]]
game_id = "SCUS-94488"
exe_sha256 = "3e77a7a1ac9ba673efb20a703de60b8504029bec54c94f3cb98476293cf74c0b"

[[plugin]]
feature = "arcade_all_cars"
id = "gt2.arcadecars"

# ---- Simulation disc: community cheats re-derived for v1.1 --------------
# DuckStation's cheats.zip entries for SCUS-94488 are for the v1.0/v1.2
# pressings: on v1.1 the whole save/profile structure sits 0x370 bytes
# higher, so their data writes land in dead memory (credits) or the wrong
# record. Each cheat below is that code shifted to the v1.1 layout, with the
# code-patch sites checked instruction by instruction against the v1.1
# GT-mode overlay, executed by gameshark_vm from mods/db/gt2recomp/
# SCUS-94488_v1.1.cht, and run in the lab with a screenshot of the result
# (docs/CHEAT_VERIFICATION.md, docs/evidence/). Every one is guarded on a
# GT-mode menu-overlay word, so nothing is written during a race - or in
# arcade mode on the Combined Disc, which reports this serial too.
# Not shipped (no v1.1 site found, or the code's effect could not be
# verified): Start With $99,000,000+, Max Cash After One Race, Start With
# All Gold Licenses (Alternate), Stop Race Timer, Hit/Tap AI, and the
# "Both Discs" race codes (their pad-word address 0x800A9228 is not the pad
# word on v1.1).

[[feature]]
id = "sim_cash"
name = "Simulation: A Ton Of Cash"
description = "Holds your credits at 99,999,999 while you are in the GT-mode menus. The community code for the v1.0/v1.2 discs writes an address that is dead memory on v1.1; this is the same cheat re-derived for the v1.1 save layout (credits at 0x801D1338) and verified in the lab."
group = "Cheats"
default_enabled = false
[[feature.target]]
game_id = "SCUS-94488"

[[plugin]]
feature = "sim_cash"
id = "gt2.gs-cash"

[[feature]]
