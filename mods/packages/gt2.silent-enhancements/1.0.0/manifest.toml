format_version = 5
id = "gt2.silent-enhancements"
version = "1.0.0"
name = "Silent's Enhancements"
author = "Silent (CookiePLMonster), asasega — packaged for GT2Recomp"
description = "Quality-of-life and performance enhancements for Gran Turismo 2, converted from Silent's GameShark code pack (github.com/CookiePLMonster/Console-Cheat-Codes) into guarded runtime patches. Verified against the GT2 Combined Disc (NTSC-U 1.1 base)."
license = "See upstream repository"
resolver = "declarative"
save_compatibility = "shared"

# Both GT2 discs, plus the fan-made Combined Disc (which also reports
# SCUS-94488). Verified against DuckStation's bundled patch database: Silent's
# 60 FPS / widescreen / draw-distance / 8MB-buffer / full-LOD codes are
# byte-identical on the Arcade and Simulation discs, because the race engine
# overlay loads at the same addresses on both. Features that genuinely differ
# per disc carry their own [[feature.target]] below.
[[target]]
game_id = "SCUS-94488"

[[target]]
game_id = "SCUS-94455"

[[feature]]
id = "overclock"
name = "CPU Overclock"
description = "Runs the emulated PS1 CPU faster than stock hardware, everywhere past the BIOS boot — races and menus alike (GT2's menus are sluggish at stock speed). FMV playback (intro and in-game movies) is left fully authentic: the overclock disengages during movies and re-engages afterward. Required by the 60 FPS feature to actually reach 60."
group = "Performance"
default_enabled = false

[[option]]
feature = "overclock"
id = "percent"
label = "CPU overclock %"
description = "How much faster than a real PS1 CPU to run. At the original 30 fps, 200 keeps the game at full speed with full-detail AI cars and the longer draw distance on — those are extra work for the PS1 CPU, and GT2 already dipped with six cars in view on the console. At 60 FPS the race engine needs roughly 150 or more to fill every frame; Silent ships 325 with his patch (DuckStation applies the same), which is the safe upper figure. Every percent costs YOUR CPU on the frames the game is busy (the idle part of a frame is skipped for free), so if 60 FPS stutters on your PC, try a lower value here — 200 or 250 — before giving up on it."
type = "integer"
min = 100
max = 400
step = 25
default = 200

[[plugin]]
feature = "overclock"
id = "gt2.overclock"

[[feature]]
id = "60fps"
name = "60 FPS"
description = "Runs the game at 60 frames per second instead of 30, and restores the tire smoke and rear-view-mirror effects to full rate at the higher frame rate. Applies to races on every disc (the codes are identical on the Arcade and Simulation discs); takes effect when a race (re)loads. Requires the CPU Overclock feature (above) to actually reach 60 — at stock speed the engine cannot fill 60 fps and races run in slow motion. FMV playback is left fully authentic: the frame-rate patches disengage during movies and re-engage afterward. Known upstream caveats: existing replays and Rally-mode AI ghosts are not compatible with 60 FPS."
group = "Performance"
default_enabled = false

[[plugin]]
feature = "60fps"
id = "gt2.silent60fps"

# 60 FPS doubles the game's simulation rate, so the emulated CPU has to do a
# frame's work in half the time - it cannot without the overclock. Enabling
# 60fps therefore switches overclock ON; the PERCENT is the player's (default
# 200; Silent's 325 is the safe upper figure). It used to be pinned to 325 by
# this constraint, which made the launcher switch 60 FPS OFF whenever the
# overclock was lowered - the two are decoupled since 0.3.0 so a player can
# find the lowest overclock their PC holds 60 at. Switching overclock off
# still cascades 60fps off. The reverse is deliberately NOT a dependency: overclock stands
# on its own, because full-detail AI cars and the longer draw distance are
# real extra work for the emulated CPU/GTE even at 30 fps - GT2 already
# dropped frames on the console with six cars in view, and those patches
# push it further. "Original (30 fps)" with the overclock on is the game at
# its own frame rate, just no longer struggling.
[[constraint]]
feature = "60fps"
kind = "requires_feature"
requires_feature = "overclock"

[[feature]]
id = "aspect"
name = "Aspect Ratio"
description = "Widescreen presentation using the framework's renderer-level support (GTE projection adjustment with per-primitive proportion correction — HUD and sprites are not stretched), combined with the cull-bound widening from Silent's 16:9 Widescreen patch so geometry no longer pops in at the revealed screen edges. The bounds scale with the chosen ratio (16:10 and 21:9 get correctly proportioned values). Select the display aspect below; 4:3 is the original presentation. Applies from the next launch."
group = "Visual"
default_enabled = false

[[option]]
feature = "aspect"
id = "ratio"
label = "Display aspect"
type = "choice"
default = "16:9"

[[option.choice]]
value = "16:9"
label = "16:9 (Widescreen)"

[[option.choice]]
value = "16:10"
label = "16:10"

[[option.choice]]
value = "21:9"
label = "21:9 (Ultrawide)"

[[plugin]]
feature = "aspect"
id = "gt2.display-aspect"

[[feature]]
id = "draw_distance"
name = "Higher Draw Distance"
description = "Slightly higher draw distance in races: the game normally reserves its longest draw distance for replays — this uses the replay distance while driving too, so track geometry fades in later. The game's draw distance is bounded by the track data itself, so the gain is modest by design. Applies in Simulation-mode races; FMV playback stays authentic."
group = "Visual"
default_enabled = false

[[plugin]]
feature = "draw_distance"
id = "gt2.drawdistance"

[[feature]]
id = "ram8_buffers"
name = "8MB RAM Polygon Buffers"
description = "Moves the renderer's polygon buffers into the expanded 8MB console RAM (which every build of this port ships with) and doubles their size, so heavy scenes stop running out of polygon budget. Part of the port: always on, not shown in the launcher."
group = "Visual"
hidden = true

[[plugin]]
feature = "ram8_buffers"
id = "gt2.ram8buffers"

[[feature]]
id = "full_lod_ai"
name = "Full Detail AI Cars"
description = "Forces every car in the race to its highest level-of-detail model — AI cars no longer switch to the simplified low-poly meshes at distance, which looks far better at high internal resolutions. REQUIRES '8MB RAM Polygon Buffers' (above) to be enabled: six full-detail cars overflow the stock polygon buffer, so this feature stays dormant until the bigger buffers are active. Takes effect when a race (re)loads."
group = "Visual"
default_enabled = false

[[plugin]]
feature = "full_lod_ai"
id = "gt2.fulllod"

# ---- Silent's remaining patches, run VERBATIM from DuckStation's patch
# database (mods/db/duckstation/*.cht, "Rev 1" = v1.1) by gameshark_vm.c -
# no hand translation. Every line of these four is byte-identical between
# the Arcade and Simulation database files, so they inherit the package's
# targets. Each carries Silent's own overlay-identity guard (A4 line), so it
# does nothing on a screen where its overlay is not resident.
[[feature]]
id = "metric_units"
name = "Metric Units"
description = "Shows speeds, distances, weights and power in metric units (km/h, km, kg, PS) instead of the NTSC release's imperial ones. Silent's patch, applied verbatim from DuckStation's database."
group = "Visual"
default_enabled = false

[[plugin]]
feature = "metric_units"
id = "gt2.gs-metric"

[[feature]]
id = "hud_mirror_toggle"
name = "HUD & Mirror Toggle (L3)"
description = "Tap L3 in a race to cycle the rear-view mirror between always on, default and always off; hold L3 (about a second) to toggle the whole HUD. Silent's patch, applied verbatim from DuckStation's database."
group = "Quality of Life"
default_enabled = false

[[plugin]]
feature = "hud_mirror_toggle"
id = "gt2.gs-hudmirror"

[[feature]]
id = "replay_cameras"
name = "Replay Cameras in Race (R1)"
description = "Makes every replay camera available while racing, and lets you switch the cinematic camera by holding R1 for half a second. Silent's patch, applied verbatim from DuckStation's database."
group = "Quality of Life"
default_enabled = false

[[plugin]]
feature = "replay_cameras"
id = "gt2.gs-replaycams"

[[feature]]
id = "bgm_switch"
name = "BGM Switch (R3)"
description = "Press R3 during a race to skip to the next music track; hold R3 for a second to mute the music. Silent's patch, applied verbatim from DuckStation's database."
