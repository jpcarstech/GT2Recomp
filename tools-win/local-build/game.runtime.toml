# Gran Turismo 2 Recompiled — runtime config.
# Lives next to "Gran Turismo 2 Recompiled.exe", in the folder that also
# contains "Gran Turismo 2 Combined.bin" / .cue and (optionally) scph1001.bin.
#
# NOTE: this is the RUNTIME variant (game-folder paths, overlay_cache on).
# The repo-root game.toml is the BUILD variant (disc/ paths, [prepare_disc]).
# Do not overwrite one with the other.

[game]
name = "Gran Turismo 2"
id = "SCUS-94488"
players = 2
exe = "extracted/SCUS_944.88"
disc = "Gran Turismo 2 Combined.cue"
load_address = "0x80010000"
entry_pc = "0x8005D5C0"
text_size = "0x00099000"
stack_base = "0x801FFF00"

# Required by the config loader even at runtime (identifies the recompiler
# inputs this build was generated from).
[recompiler]
seeds = "seeds/ghidra_funcs.txt"
# Emit a trusted mod hook at the PS-EXE entry: GT2 defeats both of the
# framework's game-start detectors (HLE handoff skips the entry dispatch;
# overlays overwrite game text so the clean-text match never fires), so the
# widescreen engage latch — and the rest of the boot handoff — never
# triggered. The hook calls fntrace_mark_game_started at entry.
mod_function_entry_funcs = ["0x8005D5C0"]
out_dir = "generated"
strict = true

[runtime]
window_title = "Gran Turismo 2 Recompiled"
memcard_dir = "saves"
mods_dir = "patches"
# Runtime-written diagnostic files go into subfolders instead of the root:
# crash report + freeze heartbeat -> diagnostics\, freeze dumps -> dumps\.
diagnostics_dir = "diagnostics"
dumps_dir = "dumps"
overlay_cache = true
# Background overlay compiler: use the full GCC toolchain (C:\msys64\mingw64\bin
# on the user PATH) instead of the bundled TinyCC — gcc-built shards run
# significantly faster. Relative paths resolve from the game folder. If gcc is
# not found on PATH at launch, the runtime falls back to the bundled TinyCC
# tier automatically; shards from both tiers load side by side.
overlay_autocompile_cmd = 'overlay_toolchain\python\python.exe overlay_toolchain\compile_overlays.py --captures overlay_captures.json --game-toml game.toml --recompiler overlay_toolchain\psxrecomp-game.exe --runtime-include overlay_toolchain\include --out-dir cache --compiler gcc --jobs 8'

[widescreen]
# Native-wide (default) only presents wide when the game renders extra width —
# untuned GT2 culls to 4:3, so it pillarboxes. Squash mode is the generic
# DuckStation-style hack: GTE X-squash + wide stretch, with the framework's
# per-prim proportion correction for HUD/sprites. Revisit when GT2 gets
# cull-site tuning for true native-wide.
native_wide = false
# The game renders widescreen NATIVELY in races (Silent's 16:9 patch, applied
# by the Aspect Ratio mod): keep the framework's GTE X-squash at identity so
# the widening is not applied twice. Present/classification stay squash-mode.
gte_squash = false
# Gameplay classifier: a RAM-word gate decides the wide present (it takes
# priority over the per-frame GTE detector, which flapped through the
# pre-race flow's 2D-heavy frames).
gameplay_state_addr = "0x80060000"
# ALWAYS-WIDE (DuckStation behavior): the gate word is EXE code at
# 0x80060000, ABOVE every overlay's load extent (max 0x8005D5B4), so it is
# loaded at boot and never overwritten — the gate matches from the moment
# the game EXE is in RAM, for every screen. (The earlier overlay-identity
# list at 0x80016A6C missed at least one screen — course select still
# flipped 4:3.) FMV still presents 4:3 (checked after this gate); the BIOS
# logos present 4:3 too (RAM is zero there before the EXE loads).
gameplay_state_values = ["0x0200A821"]
# Fallback per-frame GTE detector (unused while the state gate matches -1
# never happens with the gate configured, but harmless to keep).
gte_game_mode = true
# Course select / menu backdrops are 24-bit STILL images on the FMV display
# path and were pinned 4:3; only real MDEC playback (the intro and movies)
# should stay 4:3. Requires the stretch-stills carried patch (rebuild).
stretch_24bpp_stills = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"   # launcher Settings overrides; "16:10" also valid here
# PGXP geometry tolerance, in pixels. -1 (DuckStation's setting) disables the
# acceptance gate — but our engine's fallback corrector lacks DuckStation's
# full per-vertex provenance, so at -1 adjacent polygons sharing a vertex can
# receive different corrections and thin GAPS open along ground seams
# (observed in-race 2026-08-28). 0.1 is the user-validated sweet spot: stable
# image, wobble fixed, no seams. Revisit -1 after the PGXP coverage work.
pgxp_tolerance = 0.1

[controller]
default_mode = "analog"
p1_device = "auto"
multitap_analog = true
